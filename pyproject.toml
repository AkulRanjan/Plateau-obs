[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plateau"
version = "0.1.0"
description = "A semantic circuit breaker for autonomous AI agents: detects information stagnation instead of textual repetition."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

# Versions are pinned to the exact set resolved on the development machine so
# that two harness runs produce byte-identical metrics.json (rule 3).
dependencies = [
    "sentence-transformers==3.3.1",
    "transformers==4.57.6",
    "tokenizers==0.22.2",
    "safetensors==0.8.0",
    "torch==2.5.1",
    "numpy==2.2.6",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
]

[tool.setuptools.packages.find]
include = ["plateau*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# -----------------------------------------------------------------------------
# Determinism contract (rule 3). Consumed by plateau.encoder and eval/harness.py.
# -----------------------------------------------------------------------------
[tool.plateau]
seed = 1337
encoder_model_id = "sentence-transformers/all-MiniLM-L6-v2"
# Pinned encoder revision. Written by scripts/pin_encoder.py from the actual
# downloaded snapshot on this machine; never hand-edited, never guessed.
encoder_revision = "1110a243fdf4706b3f48f1d95db1a4f5529b4d41"
encoder_dim = 384
