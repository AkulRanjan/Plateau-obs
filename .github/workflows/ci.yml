# The checks this project already had, run on every push instead of by hand.
#
# Deliberately NOT here: the sweeps in eval/ and scripts/. They take minutes,
# they rewrite metrics.json, and rule 3 says a run is only byte-reproducible on
# one machine — so a CI runner re-measuring and diffing would report drift as
# failure on every green build. Measurements are produced locally and committed;
# CI's job is to check that what was committed still holds together.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Rule 1 gets its own gate. check_readme.py imports nothing outside the
  # standard library, so this answers "is every number in the README still
  # backed by a measurement" in seconds, without building torch.
  rule-1:
    name: Rule 1 — every README figure traces to a measurement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/check_readme.py

  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # torch 2.5.1 publishes no wheel for 3.13+, which is the floor and
        # ceiling of what this project can be tested on.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The pinned MiniLM snapshot, in the layout plateau.encoder expects:
      # models/ inside the checkout, NOT ~/.cache/huggingface. Keyed on
      # pyproject.toml because that is where the pinned revision lives, so a
      # re-pin invalidates the cache instead of silently testing against the
      # old weights.
      - name: Cache encoder weights
        uses: actions/cache@v6
        with:
          path: models
          key: encoder-${{ hashFiles('pyproject.toml') }}

      - name: Install
        run: pip install -e ".[dev,demo]"

      # Download the weights the way a developer does. This is required, not an
      # optimisation: scripts/detector_fixtures.py sets HF_HUB_OFFLINE=1 at
      # import, tests/test_detector.py imports it, and MiniLMEncoder defaults to
      # allow_download=False -- so by the time any test runs, the network is
      # closed by design. Without a populated models/ the suite cannot load the
      # encoder at all.
      #
      # pin_encoder.py is the only script permitted to touch the network. With
      # no --repin it fetches exactly the revision pyproject.toml already
      # commits to, leaves pyproject unchanged, and writes
      # models/encoder_revision.txt so the run is pinned rather than tracking
      # whatever upstream main happens to be.
      - name: Fetch pinned encoder weights
        run: python scripts/pin_encoder.py

      # The demo extra is not optional: tests/test_live_demo.py imports
      # demo.live_agent, so without httpx the suite cannot even be collected.
      - name: Tests
        run: python -m pytest

      - name: Environment / determinism report
        # Informational. Rule 3 holds per machine, so a CI runner differing from
        # the development pins is expected and must not fail the build.
        continue-on-error: true
        run: python scripts/check_env.py

  web:
    name: web console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # ci, not install: every version is pinned without a range and the
      # lockfile is committed on purpose.
      - run: npm ci

      # parity, contract, ownership, contrast, render, build, offline.
      # `npm run verify` additionally drives headless Chrome; it is run locally
      # rather than here, where a browser check is the least stable thing in the
      # pipeline and would train people to ignore a red build.
      - run: npm run check
